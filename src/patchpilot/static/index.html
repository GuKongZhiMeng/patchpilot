<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PatchPilot Mechanism Lab</title><style>
:root{color-scheme:dark;--bg:#0c111b;--card:#151d2b;--ink:#eef3ff;--muted:#9fb0ca;--accent:#72e0b8}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui;background:radial-gradient(circle at 20% 0,#18304a,var(--bg) 45%);color:var(--ink)}main{max-width:920px;margin:auto;padding:64px 24px}h1{font-size:clamp(2.2rem,7vw,5rem);margin:0;letter-spacing:-.06em}.lead{max-width:690px;color:var(--muted);font-size:1.15rem}.card{background:#151d2be8;border:1px solid #2b3a52;border-radius:18px;padding:24px;box-shadow:0 24px 70px #0008}label{display:block;margin-bottom:8px}textarea{width:100%;min-height:110px;background:#0a101a;color:var(--ink);border:1px solid #394b67;border-radius:10px;padding:14px;font:inherit}button{margin-top:12px;background:var(--accent);color:#06251a;border:0;border-radius:999px;padding:11px 20px;font-weight:750;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);min-height:48px}.grid,.state{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}.pill,.state div{min-width:0;overflow-wrap:anywhere;padding:14px;border-radius:12px;background:#111a28;border:1px solid #26364f}.pill b,.state b{display:block;color:var(--accent)}ol{padding-left:1.4rem;color:var(--muted)}li{padding:.35rem 0;border-bottom:1px solid #26364f}@media(max-width:650px){.grid,.state{grid-template-columns:1fr}}</style></head><body><main><p>AI4SE · Coding Agent Harness</p><h1>PatchPilot</h1><p class="lead">一个把治理、验证和停机写进代码，而不是寄托于提示词的 coding-agent harness。</p><div class="grid"><div class="pill"><b>Guardrail</b>危险动作确定性拦截</div><div class="pill"><b>Feedback</b>失败分类并回灌修复</div><div class="pill"><b>Circuit breaker</b>重复失败自动停机</div></div><section class="card"><label for="task">机制演示任务</label><textarea id="task">修复一次失败的单元测试，并在验证通过后停止。</textarea><button id="run">运行离线 mock 演示</button><div class="state" aria-live="polite"><div><b>工作区</b><span id="workspace">等待运行</span></div><div><b>安全状态</b><span id="safety">等待运行</span></div><div><b>反馈闭环</b><span id="feedback">等待运行</span></div></div><h2>事件时间线</h2><ol id="events"><li>尚无事件</li></ol><pre id="out">等待运行…</pre></section></main><script>document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#out'),events=document.querySelector('#events');out.textContent='运行中…';events.textContent='';try{const r=await fetch('/api/demo',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({task:document.querySelector('#task').value})}),d=await r.json();document.querySelector('#workspace').textContent=d.workspace;document.querySelector('#safety').textContent=d.guardrail==='blocked'?'危险动作已拦截':'需检查';document.querySelector('#feedback').textContent=d.feedback_loop+' / '+d.deep_mechanism;for(const e of d.events){const li=document.createElement('li');li.textContent=`Step ${e.step} · ${e.type} · ${e.payload.name||''}`;events.appendChild(li)}out.textContent=`动作已改变：${d.action_changed}；反馈已回灌：${d.feedback_seen}`}catch(e){out.textContent='请求失败：'+e}}</script></body></html>

stages: [test, build]

unit-test:
  stage: test
  image: python:3.12-slim
  script:
    - PYTHONPATH=src python -m unittest discover -s tests -v

docker-build:
  stage: build
  image: docker:27-cli
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t patchpilot:$CI_COMMIT_SHA .

